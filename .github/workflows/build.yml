name: build-mac
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p lc-core --release
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mac-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Build
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LinhasConectoras-mac
          path: dist/LinhasConectoras-mac.zip
          if-no-files-found: error
      - name: Publicar na release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dist/LinhasConectoras-mac.zip \
            --title "Linhas Conectoras - build ${GITHUB_SHA::7}" \
            --notes "Build automatico do commit ${GITHUB_SHA::7}. Veja o README para instalar." \
            --prerelease
